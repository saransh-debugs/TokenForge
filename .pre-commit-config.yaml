# Same checks locally and in CI (`make lint typecheck`).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        exclude: ^serving/helm/.*/templates/
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        entry: uv run --no-sync mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: helm-lint
        name: helm lint
        entry: bash -c 'for c in serving/helm/gateway serving/helm/mock-engine; do helm lint --strict "$c" >/dev/null || exit 1; done'
        language: system
        files: ^serving/helm/
        pass_filenames: false
      - id: hadolint
        name: hadolint
        entry: bash -c 'command -v hadolint >/dev/null && hadolint serving/docker/Dockerfile || true'
        language: system
        files: Dockerfile
        pass_filenames: false
