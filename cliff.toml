# git-cliff config: CHANGELOG.md from conventional commits (`make changelog`).
[changelog]
header = "# Changelog\n\n"
body = """
{% if version %}## {{ version }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first }}
{% endfor %}{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "m[0-9]+-.*"
commit_parsers = [
  { message = "^feat", group = "features" },
  { message = "^fix", group = "fixes" },
  { message = "^perf", group = "performance" },
  { message = "^test", group = "tests" },
  { message = "^docs", group = "docs" },
  { message = "^(chore|ci|build|refactor)", group = "maintenance" },
]
