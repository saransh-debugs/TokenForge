[project]
name = "tokenforge"
version = "0.1.0"
description = "One 7B model from raw weights to a fault-tested, benchmarked deployment on a single NVIDIA L4."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
authors = [{ name = "S.S." }]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
# Kernel layer. On GPU boxes torch comes from the vLLM install (versions.lock);
# this extra is the CPU / interpreter environment used by CI.
kernels = ["torch==2.14.0", "triton~=3.8.0"]
serving = [
  "fastapi>=0.115,<0.137",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "prometheus-client>=0.20",
  "pydantic>=2.12",
]
bench = ["httpx>=0.27", "nvidia-ml-py>=12"]

[project.scripts]
tokenforge-gateway = "tokenforge.serving.gateway.__main__:main"
tokenforge-mock-engine = "tokenforge.serving.mock_engine.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-timeout>=2.3",
  "hypothesis>=6.100",
  "ruff==0.17.3",
  "mypy==2.4.1",
  "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tokenforge"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["bench/results", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PL", "PT", "C4", "PERF", "TID"]
ignore = [
  "PLR0913", # kernels take many arguments by design
  "PLR0917",
  "PLC0415", # torch/triton imports are deferred so dispatch and serving import without them
  "N812",    # `import torch.nn.functional as F` is the PyTorch convention
  "PLR2004", # magic numbers are hardware constants
  "PLR0911", # request handlers map many failure modes to responses
  "PLR0912",
  "PLR0915",
  "N803",    # Triton constexpr arguments are UPPER_CASE
  "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415"]
"tokenforge/kernels/triton/**" = ["PLC0415"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
packages = ["tokenforge"]

[[tool.mypy.overrides]]
# Kernel code: Triton's typing is incomplete, so @triton.jit bodies are relaxed.
module = ["tokenforge.kernels.triton", "tokenforge.kernels.triton.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false
disallow_untyped_calls = false
disallow_any_generics = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["triton", "triton.*", "pynvml", "hypothesis.*", "transformers", "transformers.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 600
markers = [
  "gpu: needs a CUDA device (GPU-dev / GPU-full tiers)",
  "sm89: needs compute capability >= 8.9 (L4) for FP8",
  "slow: long-running; excluded from the CPU tier",
]
filterwarnings = ["error::DeprecationWarning:tokenforge.*"]
